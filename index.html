<!DOCTYPE HTML>
<html>
<head>
  <title>ESP32 Web Server</title>
  <meta name="viewport" charset="UTF-8" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
  <style>
    html {font-family: Arial; display: inline-block; text-align: center;}
    h2 {font-size: 2.5rem;}
    p {font-size: 2.0rem;}
    body {max-width: 600px; margin: 0px auto; padding-bottom: 25px;}
    .switch {position: relative; display: inline-block; width: 5rem; height: 2.4rem} 
    .switch input {display: none}
    .slider {position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 24px}
    .slider:before {position: absolute; content: ""; height: 2.2rem; width: 2.2rem; left: .25rem; bottom: .1rem; background-color: #fff; -webkit-transition: .2s; transition: .2s; border-radius: 58px}
    input:checked+.slider {background-color: #2196F3}
    input:checked+.slider:before {-webkit-transform: translateX(2.2rem); -ms-transform: translateX(2.2rem); transform: translateX(2.2rem)}
    .units { font-size: 2.0rem; }
    .dht-labels{
      font-size: 1.5rem;
      vertical-align:middle;
      padding-bottom: 15px;
    }
	#openLoginModalButton { text-align: center; }
	.modal { text-align: center; }
  </style>
</head>
<body>
    <button id="openLoginModalButton" onclick="document.getElementById('id01').style.display='block'" 
            style="width:auto;">Login</button>

    <div id="id01" class="modal">
        <form class="modal-content animate" action="/action_page.php">
            <div class="imgcontainer">
                <span onclick=
                      "document.getElementById('id01').style.display='none'" 
                      class="close"
                      title="Close Modal">&times;</span>
            </div>

            <div class="container">
                <label><b>Email</b></label>
                <input type="text" 
                       placeholder="Enter email" 
                       name="email" required>

                <label><b>Password</b></label>
                <input type="password" 
                       placeholder="Enter Password" 
                       name="password" required>

                <button type="button" id="loginButton">Login</button>
                <!--<button type="submit" id="loginButton">Login</button>
                <input type="checkbox" checked="checked">Remember me-->
            </div>

            <div class="container" 
                 style="background-color:#f1f1f1">
                <button type="button" 
                        onclick=
                        "document.getElementById('id01').style.display='none'"
                    class="cancelbtn">Cancel</button>
            </div>
        </form>
    </div>

	<div id="mainContent" style="display:none;">
	  <h2>Relé(k) állítása</h2>
	  <h4>Relé #1 - GPIO 25</h4><label class="switch"><input type="checkbox" id="relay1"><span class="slider"></span></label>

	  <br>
	  <br>
	  <h2>DHT11 szenzor infók</h2>
	  <p>
		<i class="fas fa-thermometer-half" style="color:#059e8a;"></i> 
		<span class="dht-labels">Hőmérséklet</span> 
		<span id="temperature">N/A</span>
		<span class="units">&deg;C</span>
	  </p>
	  <p>
		<i class="fas fa-tint" style="color:#00add6;"></i> 
		<span class="dht-labels">Páratartalom</span>
		<span id="humidity">N/A</span>
		<span class="units">&percnt;</span>
	  </p>

	  <br>
	  <div class="container"><div class="row"><h2>RGB LED színválasztó</h2></div>
	  <input class="jscolor {onFineChange:'updatePickerInputValue(this)'}" id="colorPickerInput">

	  <br>
	  <br>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_red" role="button" style='background-color: red;'>Piros</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_green" role="button" style='background-color: green;'>Zöld</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_blue" role="button" style='background-color: blue;'>Kék</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_yellow" role="button" style='background-color: yellow; color: black;'>Sárga</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_cyan" role="button" style='background-color: cyan; color: black;'>Cián</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_magenta" role="button" style='background-color: magenta;'>Magenta</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_white" role="button" style='background-color: white; color: black;'>Fehér</a>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_off" role="button">Kikapcs</a>
	  <br>
	  <br>
	  <label>Fade speed: <input id="fadeSpeedInput" value="20"></label>
	  <a class="btn btn-secondary btn-lg" href="#" id="change_color_smooth" role="button" style='background-image: linear-gradient(to right, red,orange,yellow,green,blue,indigo,violet);'>Smooth</a>
	  </div>

	  <br>
	  <h2>OLED kijelző</h2>
	  <label>Felirat: <input id="oledTextInput" value="Egy sor 10"></label>
	  <label>Betűméret: <input id="oledFontSizeInput" value="2"></label>
	  <button id="setOledTextButton">Küldés</button>

	  <br>
	  <br>
	  <h2>NFC kártyaolvasó utoljára kiolvasott szövege:</h2>
	  <label id="nfcCardText"></label>
	  
	  <br>
	  <br>
	  <h4>Beépített kék LED</h4><label class="switch"><input type="checkbox" id="builtInBlueLedInput"><span class="slider"></span></label>

	  <br>
	  <br>
	  <button id="deepSleepInput">Deep sleep</button>
	</div>

	<script>
        let modal = document.getElementById('id01');
        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
		
		if (Notification.permission !== "granted") {
			Notification.requestPermission();
		}

		let updateAvailable = false;

		function showUpdateModal() {
			const shouldReload = confirm(
				"Új verzió érhető el. Frissíted az oldalt?"
			);

			if (shouldReload) {
				location.reload(true);
			}
		}
		
		function onWebsiteVersionChanged() {
			updateAvailable = true;

			if (document.hidden) {
				if (Notification.permission === "granted") {
					new Notification(
						"ESP32 Controller",
						{
							body: "Új verzió érhető el."
						}
					);
				}
			}
			else {
				showUpdateModal();
			}
		}
		
		document.addEventListener("visibilitychange", () => {
			if (!document.hidden && updateAvailable) {
				//updateAvailable = false;
				showUpdateModal();
			}
		});
		
		/*async function initialize()
		{
			if (Notification.permission !== "granted")
			{
				await Notification.requestPermission();
			}

			// további inicializálás...
		}

		initialize();*/
    </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jscolor/2.0.4/jscolor.min.js"></script>
  <script type="module">
    function updatePickerInputValue(colorPicker) {
		let r = Math.round(colorPicker.rgb[0]);
		let g = Math.round(colorPicker.rgb[1]);
		let b = Math.round(colorPicker.rgb[2]);

		sendColor(r, g, b);
    }
	window.updatePickerInputValue = updatePickerInputValue; // globálissá tesszük a függvényt
	
    function sendColor(r, g, b) {
		update(ref(db, "devices/esp32_01/rgb"),
		{
			r: r,
			g: g,
			b: b,
			timestamp: Date.now()
		});
    }
	
	//import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
	import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

	// Import the functions you need from the SDKs you need
	import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
	// TODO: Add SDKs for Firebase products that you want to use
	// https://firebase.google.com/docs/web/setup#available-libraries

	import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

	// Your web app's Firebase configuration
	const firebaseConfig = {
		apiKey: "AIzaSyAaIWr0XBCBq0wmaNUtaTTJv6y8b6tRA1E",
		authDomain: "psychobuci-esp32.firebaseapp.com",
		databaseURL: "https://psychobuci-esp32-default-rtdb.europe-west1.firebasedatabase.app",
		projectId: "psychobuci-esp32",
		storageBucket: "psychobuci-esp32.firebasestorage.app",
		messagingSenderId: "700192701514",
		appId: "1:700192701514:web:aeb04d8e67a72be9777ab3"
	};

	// Initialize Firebase
	const app = initializeApp(firebaseConfig);

	const auth = getAuth();
	//await signInAnonymously(auth);
	
	let db;
	
	document.getElementById("loginButton").addEventListener("click", async () =>
	{
		const email = document.getElementsByName("email")[0].value;

		const password = document.getElementsByName("password")[0].value;

		try
		{
			await signInWithEmailAndPassword(
				auth,
				email,
				password
			);
		}
		catch (error)
		{
			alert(error.message);
		}
	});
	
	onAuthStateChanged(auth, user => {
		if (auth.currentUser.accessToken.length > 0) {
			SetPageAfterLogin();
		}
	});
	
	function SetPageAfterLogin() {
		let modal = document.getElementById('id01');
		modal.style.display = "none";
		//let loginBtn = document.getElementById('openLoginModalButton');
		//loginBtn.style.display = "none";
		let mainContent = document.getElementById('mainContent');
		mainContent.style.display = "block";
		
		db = getDatabase(app);
	
		let CURRENT_VERSION = null;
	  
		const deviceRef = ref(db, "devices/esp32_01");
		
		onValue(deviceRef, (snapshot) => {
			const data = snapshot.val();
			document.getElementById("relay1").checked = data.relay;
			document.getElementById("temperature").textContent = data.temperature - 1.5; // másik hőmérő által úgy látszik, hogy túl sokat mér
			document.getElementById("humidity").textContent = data.humidity;
			document.getElementById("builtInBlueLedInput").checked = data.builtInBlueLed;
			document.getElementById("nfcCardText").textContent = data.nfcCardText;
		});
	  
		document.getElementById("relay1").onchange = (event) => {
			let state = event.target.checked;
			update(ref(db, "devices/esp32_01"), {
				relay: state
			});
		};

		document.getElementById("builtInBlueLedInput").onchange = (event) => {
			let state = event.target.checked;
			update(ref(db, "devices/esp32_01"), {
				builtInBlueLed: state
			});
		};

		document.getElementById("change_color_red").onclick = () => {
			sendColor(255, 0, 0);
		};
		document.getElementById("change_color_green").onclick = () => {
			sendColor(0, 255, 0);
		};
		document.getElementById("change_color_blue").onclick = () => {
			sendColor(0, 0, 255);
		};
		document.getElementById("change_color_yellow").onclick = () => {
			sendColor(255, 255, 0);
		};
		document.getElementById("change_color_cyan").onclick = () => {
			sendColor(0, 255, 255);
		};
		document.getElementById("change_color_magenta").onclick = () => {
			sendColor(255, 0, 255);
		};
		document.getElementById("change_color_white").onclick = () => {
			sendColor(255, 255, 255);
		};
		document.getElementById("change_color_off").onclick = () => {
			sendColor(0, 0, 0);
		};

		document.getElementById("change_color_smooth").onclick = () => {
			const fadeSpeedInput = document.getElementById('fadeSpeedInput');
			let fadeSpeed = fadeSpeedInput.value;
			update(ref(db, "devices/esp32_01/rgbAnimation"), {
				fadeSpeed: fadeSpeed,
				timestamp: Date.now()
			});
		};
		
		document.getElementById("setOledTextButton").onclick = () => {
			const oledTextInput = document.getElementById('oledTextInput');
			let oledText = oledTextInput.value;
			const oledFontSizeInput = document.getElementById('oledFontSizeInput');
			let oledFontSize = oledFontSizeInput.value;
			
			update(ref(db, "devices/esp32_01/oled"),
			{
				text: oledText,
				fontSize: oledFontSize,
				timestamp: Date.now()
			});
		};

		document.getElementById("deepSleepInput").onclick = () => {
			if (!confirm("Biztos, hogy elaltatod az eszközt?")) {
				return;
			}
			update(ref(db, "devices/esp32_01"), {
				deepSleep: true
			});
		};
		
		onValue(ref(db, "websiteVersion"), (snapshot) => {
			const latestVersion = snapshot.val();
			if (CURRENT_VERSION == null) {
				CURRENT_VERSION = latestVersion;
			}
			else if (latestVersion > CURRENT_VERSION) {
				/*if (confirm("Új verzió érhető el. Újratöltöd az oldalt?")) {
					location.reload(true);
				}*/
				onWebsiteVersionChanged();
			}
		});
		
		/*const connectedRef = ref(db, ".info/connected");

		onValue(connectedRef, async (snap) => {
			if (snap.val() === true) {
				// A kapcsolat (újra)él! Biztonság kedvéért ellenőrizzük a verziót.
				const snapshot = await get(ref(db, "websiteVersion"));
				const latestVersion = snapshot.val();
				
				if (CURRENT_VERSION !== null && latestVersion > CURRENT_VERSION) {
					if (confirm("Új verzió érhető el. Újratöltöd az oldalt?")) {
						location.reload(true);
					}
				}
			}
		});*/
	}
</script>
</body>
</html>
